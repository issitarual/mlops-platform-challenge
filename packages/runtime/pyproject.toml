[project]
name = "mlship-runtime"
version = "0.1.0"
description = "Code that runs inside the training/serving image: training runner and REST API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "mlflow-skinny>=3.17.2",
    "mlship-sdk",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "skops>=0.16.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
mlship-sdk = { workspace = true }
