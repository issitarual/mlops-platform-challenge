# Local MLflow tracking server + model registry.
# Production equivalent: managed MLflow on SageMaker, artifacts in S3 (docs/architecture).
#
# The server proxies artifacts (--artifacts-destination): clients upload through it and
# never need storage credentials. Switching to S3 changes only this file.
services:
  mlflow:
    # Same version as the mlflow-skinny client in uv.lock (3.17.2), pinned by the digest
    # of the multi-arch index (docker buildx imagetools inspect, 24/10).
    image: ghcr.io/mlflow/mlflow:v3.18.0@sha256:257204c77980b0f3450a26eb6089e487603fcdd4509529eadaf88f90669f5c13
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    environment:
      MLFLOW_DISABLE_TELEMETRY: "true"  # MLflow 3 sends usage telemetry by default
    ports:
      - "127.0.0.1:5000:5000"  # bound to localhost only
    volumes:
      - mlflow-data:/mlflow  # named volume: no host permission or path issues
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  # Monitoring of `mlship serve` (ADR-016): docker compose --profile monitoring up -d
  # Production equivalent: see docs/architecture.
  prometheus:
    profiles: ["monitoring"]
    # Pinned by the digest of the multi-arch index (docker buildx imagetools inspect, 26/10).
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    networks: [default, serving]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    # Pinned by the digest of the multi-arch index (docker buildx imagetools inspect, 26/10).
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    depends_on: [prometheus]
    environment:
      # Read-only and local: anonymous viewers, no login, nothing to edit or leak.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mlship-serving.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

networks:
  # `mlship serve` attaches each API here (alias mlship-api). Only Prometheus joins it,
  # so the API, which runs the scientist's model, shares no network with MLflow or Grafana.
  serving:
    name: mlship-serving

volumes:
  mlflow-data:
