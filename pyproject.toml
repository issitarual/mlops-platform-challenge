# Workspace root (virtual: it is not a package itself).
# Members: packages/sdk, packages/runtime, packages/cli.
[tool.uv]
# Same uv everywhere: locally and in CI (setup-uv reads this field).
required-version = "==0.13.5"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "httpx2>=2.16.0",
    "locust>=2.46.7,<2.47",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "sqlalchemy>=2.1.6",
]

# ---------------------------------------------------------------------------
# Tooling (single source of truth for the whole workspace)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/sdk/src", "packages/runtime/src", "packages/cli/src"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "S",       # bandit (security: shell=True, eval, hardcoded secrets...)
    "SIM",     # simplify
    "PTH",     # prefer pathlib
    "RUF",     # ruff-specific
    "TID",     # tidy imports (no relative imports)
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]  # asserts are the point; "/tmp" there is a container path
"loadtest/**" = ["S311"]  # picks rows to send, not secrets

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["packages/sdk/src", "packages/runtime/src", "packages/cli/src", "tests", "loadtest"]

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["docker", "docker.*", "mlflow", "mlflow.*", "sklearn", "sklearn.*", "skops", "skops.*", "pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
pythonpath = ["tests/unit/cli", "tests/unit/runtime", "tests/support"]  # shared helpers
markers = [
    "integration: needs Docker or the MLflow server",
    "e2e: full init -> serve -> predict flow",
]
# Any new warning fails the suite: versions are locked, so a new one only appears
# when the lock changes, and is looked at then. Known ones, all from third-party code:
filterwarnings = [
    "error",
    # MLflow 3.17 on pandas 3: deprecated comparison inside mlflow.models.utils.
    "ignore:Operation with range is deprecated",
    # MLflow 3.17 on SQLAlchemy 2.1 (test-only SQLite store).
    "ignore:The ``noload`` loader strategy is deprecated",
    # MLflow hints on import and on PredictOnlyModel, which has no type hints on
    # purpose: MLflow would read them as a schema and transform the inputs (ADR-017).
    "ignore:.*Any type hint is inferred as AnyType",
    "ignore:.*Add type hints to the `predict` method",
    # MLflow hint for integer columns in the test fixture; for users this is a
    # train/serve skew risk, surfaced as a run warning in E5.
    "ignore:.*Inferred schema contains integer column",
]
