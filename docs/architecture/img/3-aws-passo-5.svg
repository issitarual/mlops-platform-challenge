<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="540" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".12"/></filter></defs><rect width="100%" height="100%" fill="#eef3fb"/>
<rect x="160" y="40" width="940" height="370" rx="8" fill="#f5f3ff" stroke="#64748b" stroke-width="2" filter="url(#sh)"/>
<text x="180" y="74" font-size="18" font-weight="700" fill="#111827">Controles transversais</text><text x="180" y="94" font-size="11" fill="#475569">aplicam-se a todos os componentes dos passos 1 a 4</text>
<rect x="180" y="120" width="290" height="110" rx="8" fill="#fff"/><text x="192" y="142" font-size="10" font-weight="700" fill="#0d9aa6">REDE</text>
<text x="192" y="160" font-size="11" font-family="Courier New, monospace" fill="#1f2937">VPC privada, sem rota para a internet.</text>
<text x="192" y="175" font-size="11" font-family="Courier New, monospace" fill="#1f2937">VPC endpoints: S3, ECR, Logs, STS,</text>
<text x="192" y="190" font-size="11" font-family="Courier New, monospace" fill="#1f2937">SageMaker.</text>
<rect x="484" y="120" width="290" height="110" rx="8" fill="#fff"/><text x="496" y="142" font-size="10" font-weight="700" fill="#3b6fd8">IDENTIDADE</text>
<text x="496" y="160" font-size="11" font-family="Courier New, monospace" fill="#1f2937">Uma role por função. OIDC no CI. Nenhuma</text>
<text x="496" y="175" font-size="11" font-family="Courier New, monospace" fill="#1f2937">chave de longa duração.</text>
<rect x="788" y="120" width="290" height="110" rx="8" fill="#fff"/><text x="800" y="142" font-size="10" font-weight="700" fill="#7c3aed">DADOS</text>
<text x="800" y="160" font-size="11" font-family="Courier New, monospace" fill="#1f2937">S3 versionado, Object Lock, KMS.</text>
<text x="800" y="175" font-size="11" font-family="Courier New, monospace" fill="#1f2937">Manifesto com URI, versão e hash.</text>
<rect x="180" y="244" width="290" height="110" rx="8" fill="#fff"/><text x="192" y="266" font-size="10" font-weight="700" fill="#d64545">SEGREDOS</text>
<text x="192" y="284" font-size="11" font-family="Courier New, monospace" fill="#1f2937">Secrets Manager. Nenhum segredo em</text>
<text x="192" y="299" font-size="11" font-family="Courier New, monospace" fill="#1f2937">imagem, log ou repositório.</text>
<rect x="484" y="244" width="290" height="110" rx="8" fill="#fff"/><text x="496" y="266" font-size="10" font-weight="700" fill="#ee8a1f">AUDITORIA</text>
<text x="496" y="284" font-size="11" font-family="Courier New, monospace" fill="#1f2937">CloudTrail e Config. Tags obrigatórias</text>
<text x="496" y="299" font-size="11" font-family="Courier New, monospace" fill="#1f2937">por equipe e modelo.</text>
<rect x="788" y="244" width="290" height="110" rx="8" fill="#fff"/><text x="800" y="266" font-size="10" font-weight="700" fill="#1f9d57">CUSTO</text>
<text x="800" y="284" font-size="11" font-family="Courier New, monospace" fill="#1f2937">Spot no treino, autoscaling, lote</text>
<text x="800" y="299" font-size="11" font-family="Courier New, monospace" fill="#1f2937">separado do online, Budgets.</text>
<rect x="40" y="470" width="86" height="34" rx="12" fill="#3b82f6"/><text x="83" y="492" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">STEP 5</text><text x="142" y="494" font-size="20" font-weight="700" fill="#111827">Rede, identidade e custo valem para tudo</text>
<text x="1280" y="492" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="end">ARQUITETURA 3 DE 3 · PRODUÇÃO NA AWS</text>
