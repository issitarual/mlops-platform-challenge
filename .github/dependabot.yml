# Weekly, grouped: one PR per ecosystem instead of one per package. The base image
# digest lives in config.py, where Dependabot does not look (DECISIONS: "Com mais tempo").
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]