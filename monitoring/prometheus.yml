# Scrapes every API started by `mlship serve`. Each one joins the mlship-serving network
# with the alias mlship-api, so DNS lists all of them, whatever host port they publish.
# Production equivalent: see docs/architecture.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mlship-serving
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["mlship-api"]
        type: A
        port: 8080
        refresh_interval: 5s
